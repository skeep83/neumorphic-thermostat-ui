name: Validate Plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate hacs.json
        run: |
          python3 << 'EOF'
          import json
          import os
          
          # Validate hacs.json
          with open('hacs.json', 'r') as f:
            data = json.load(f)
            
          # Check required fields
          assert 'name' in data, "Missing 'name'"
          assert 'content_type' in data, "Missing 'content_type'"
          assert data['content_type'] == 'plugin', f"content_type must be 'plugin', got '{data['content_type']}'"
          
          # Check for JS files
          if os.path.isdir('dist'):
            js_files = [f for f in os.listdir('dist') if f.endswith('.js')]
            assert len(js_files) > 0, "No .js files found in dist/"
            print(f"✓ Found {len(js_files)} JS file(s) in dist/")
          
          print(f"✓ Repository is valid as Plugin (Dashboard)")
          print(f"  Name: {data['name']}")
          print(f"  Type: {data['content_type']}")
          EOF


